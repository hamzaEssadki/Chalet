name: Rappels de paiement

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer aussi les rappels de paiement (même avant la date limite)"
        type: boolean
        default: false

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        working-directory: rappels
        run: npm install --no-audit --no-fund
      - name: Envoyer les rappels
        run: node rappels/rappels.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          FORCE: ${{ inputs.force }}

